[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-jp-microalpha"
version = "0.1.0"
description = "Causal research and replay core for the Japanese stock multi-horizon specification"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
microalpha = "ibkr_microalpha.cli:main"

[tool.setuptools.packages.find]
include = ["ibkr_microalpha*"]
